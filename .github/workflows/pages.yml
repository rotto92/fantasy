name: Build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install generation dependency
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-generation.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install pinned Chromium for browser contracts
        run: npm run browser:install
      - name: Build the Pages bundle
        run: npm run build
      - name: Verify generated artifacts are synchronized
        run: npm run check:generated
      - name: Audit generated release files
        run: npm run test:audit && npm run audit:release-import && npm run audit:pages
      - name: Run browser contracts
        run: |
          VITE_BASE=/ npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/fantasy-vite.log" 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$VITE_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/fantasy-vite.log"
            exit 1
          fi
          npm run test:smoke
          npm run test:discovery
          npm run test:static
      - name: Verify workflow publication boundaries
        run: npm run test:workflow
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
