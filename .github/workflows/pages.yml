name: Build and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install generation dependency
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check openpyxl
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install pinned Chromium for browser contracts
        run: npm run browser:install
      - name: Build the Pages bundle
        run: npm run build
      - name: Audit generated release files
        run: npm run audit:release-import
      - name: Run browser contracts
        run: |
          VITE_BASE=/ npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/fantasy-vite.log" 2>&1 &
          sleep 2
          npm run test:smoke
          npm run test:discovery
          npm run test:static
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
